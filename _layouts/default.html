<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "ko" }}">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <meta name="google-site-verification" content="googlec51fe6c03c100160" />
  <meta name="naver-site-verification" content="716daf1fd0674e0e042ac9bc407ee5fa3560d6ec" />
  <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
  <!-- Google Fonts: Inter & Pretendard -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script>
    (function() {
      const theme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  {%- if site.google_analytics -%}
  <!-- Global site tag (gtag.js) - Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ site.google_analytics }}');
  </script>
  {%- endif -%}
  {%- if site.google_adsense and site.google_adsense != "" -%}
  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ site.google_adsense }}" crossorigin="anonymous"></script>
  {%- endif -%}
  <style>
    /* Permanently Hide Google Translate Top Banner Toolbar */
    .goog-te-banner-frame,
    iframe.goog-te-banner-frame,
    .goog-te-banner-frame.skiptranslate,
    #goog-gt-tt,
    .goog-te-balloon-frame,
    div#goog-gt- {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      width: 0 !important;
      height: 0 !important;
    }
    body {
      top: 0px !important;
      position: static !important;
    }
    .goog-text-highlight {
      background-color: transparent !important;
      box-shadow: none !important;
    }
    #google_translate_element,
    .goog-te-gadget,
    .goog-te-spinner-pos {
      display: none !important;
    }
    
    .lang-switcher {
      display: inline-flex;
      align-items: center;
      margin-left: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .lang-switcher .lang-sep {
      margin: 0 4px;
      opacity: 0.35;
      color: var(--text-color);
    }
    .lang-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px 4px;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .lang-btn:hover {
      color: var(--accent-color);
    }
    .lang-btn.active {
      color: var(--accent-color) !important;
      font-weight: 800;
      text-decoration: underline;
      text-underline-offset: 4px;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wrapper site-header-wrapper">
      <a class="site-title" rel="author" href="{{ "/" | relative_url }}">{{ site.title | escape }}</a>
      <nav class="site-nav">
        <div class="trigger">
          <a class="page-link" href="{{ "/archive/" | relative_url }}">전체 글</a>
          <a class="page-link" href="{{ "/about/" | relative_url }}">소개</a>
          <a class="page-link" href="{{ "/feed.xml" | relative_url }}" target="_blank">RSS</a>
          
          <!-- Seamless Minimalist Language Switcher (KO / EN) -->
          <div class="lang-switcher">
            <button class="lang-btn active" data-lang="ko" onclick="switchLanguage('ko')">KO</button>
            <span class="lang-sep">/</span>
            <button class="lang-btn" data-lang="en" onclick="switchLanguage('en')">EN</button>
          </div>

          <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle theme">
            <!-- Sun icon -->
            <svg class="sun-icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <!-- Moon icon -->
            <svg class="moon-icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
        </div>
      </nav>
    </div>
  </header>

  <main class="page-content" aria-label="Content">
    <div class="wrapper">
      {{ content }}
    </div>
  </main>

  <footer class="site-footer h-card">
    <div class="wrapper">
      <div class="footer-col-wrapper" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; padding: 12px 0;">
        <p class="text-muted" style="margin: 0;">© {{ site.time | date: '%Y' }} {{ site.title }}. All rights reserved.</p>
        <div class="footer-links" style="display: flex; gap: 16px; font-size: 0.875rem;">
          <a class="page-link" href="{{ "/about/" | relative_url }}">소개 (About)</a>
          <a class="page-link" href="{{ "/privacy/" | relative_url }}">개인정보처리방침</a>
          <a class="page-link" href="{{ "/disclaimer/" | relative_url }}">면책조항</a>
        </div>
      </div>
    </div>
  </footer>
  <script>
    // Theme Toggle Logic
    const toggleBtn = document.getElementById('theme-toggle');
    if (toggleBtn) {
      toggleBtn.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
      });
    }

    // Scroll Progress Logic
    const progressBar = document.querySelector('.reading-progress-fill');
    if (progressBar) {
      window.addEventListener('scroll', () => {
        const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
        const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        const scrolled = height > 0 ? (winScroll / height) * 100 : 0;
        progressBar.style.width = scrolled + "%";
      });
    }

    // Wrap tables for responsive horizontal scrolling
    const postContent = document.querySelector('.post-content');
    if (postContent) {
      const tables = postContent.querySelectorAll('table');
      tables.forEach(table => {
        const wrapper = document.createElement('div');
        wrapper.className = 'table-wrapper';
        table.parentNode.insertBefore(wrapper, table);
        wrapper.appendChild(table);
      });
    }
  </script>

  <!-- Hidden Google Translate Element -->
  <div id="google_translate_element"></div>
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'ko',
        includedLanguages: 'ko,en',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
        autoDisplay: false
      }, 'google_translate_element');
    }
  </script>
  <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  <script>
    function switchLanguage(lang) {
      const targetLang = (lang === 'en') ? 'en' : 'ko';
      const domain = window.location.hostname;
      document.cookie = "googtrans=/ko/" + targetLang + "; path=/; domain=" + domain;
      document.cookie = "googtrans=/ko/" + targetLang + "; path=/;";
      
      const select = document.querySelector('.goog-te-combo');
      if (select) {
        select.value = targetLang;
        select.dispatchEvent(new Event('change'));
      }
      setTimeout(() => {
        location.reload();
      }, 100);
    }

    function updateLangUI(lang) {
      document.querySelectorAll('.lang-btn').forEach(btn => {
        if (btn.getAttribute('data-lang') === lang) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }

    // MutationObserver to instantly remove any Google Translate banner iframe before rendering
    const bannerObserver = new MutationObserver(() => {
      const frames = document.querySelectorAll('iframe.goog-te-banner-frame, .goog-te-banner-frame, #goog-gt-tt');
      frames.forEach(f => f.remove());
      if (document.body.style.top !== '0px' && document.body.style.top !== '') {
        document.body.style.top = '0px';
      }
      if (document.documentElement.style.top !== '0px' && document.documentElement.style.top !== '') {
        document.documentElement.style.top = '0px';
      }
    });
    bannerObserver.observe(document.documentElement, { childList: true, subtree: true });

    document.addEventListener('DOMContentLoaded', () => {
      const match = document.cookie.match(/(?:^|;) *googtrans=([^;]*)/);
      const currentLang = match ? (match[1].split('/')[2] || 'ko') : 'ko';
      updateLangUI(currentLang);
    });
  </script>
</body>
</html>
