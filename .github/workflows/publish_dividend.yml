name: Auto Publisher - Monthly Dividend

on:
  schedule:
    - cron: '0 21 * * *' # 매일 KST 06:00 (UTC 21:00)
  repository_dispatch:
    types: [trigger-dividend]
  workflow_dispatch: # 수동 실행

permissions:
  contents: write

jobs:
  publish-dividend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run auto blogger script (Dividend)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY 시크릿이 설정되어 있지 않습니다. Settings > Secrets and variables > Actions 에서 추가하세요."
            exit 1
          fi
          python scripts/auto_blogger.py --category dividend

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add _posts/
          git commit -m "Auto-published dividend post: $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push origin main

      - name: Send Telegram notification
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d "text=✅ 오토블로그 오전(배당금) 포스트 업로드가 완료되었습니다."
